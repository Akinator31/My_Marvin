version: "3.8"
services:
  jenkins:
    build: .
    environment:
      - PASSWORD=${Jigglypuff_PASSWORD}
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./configuration.yml:/var/jenkins_home/casc_configs/configuration.yml
      - ./job_dsl.yml:/var/jenkins_home/job_dsl.yml
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
