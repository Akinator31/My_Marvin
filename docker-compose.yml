version: "3.8"
services:
  jenkins:
    build: .
    environment:
      - USER_CHOCOLATEEN_PASSWORD=${USER_CHOCOLATEEN_PASSWORD}
      - USER_VAUGIE_G_PASSWOR=${USER_VAUGIE_G_PASSWORD}
      - USER_I_DONT_KNOW_PASSWORD=${USER_I_DONT_KNOW_PASSWORD}
      - USER_NASSO_PASSWORD=${USER_NASSO_PASSWORD}
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/my_marvin.yml
    volumes:
      - ./my_marvin.yml:/var/jenkins_home/casc_configs/my_marvin.yml
      - ./job_dsl.groovy:/var/jenkins_home/job_dsl.groovy
      - /var/run/docker.sock:/var/run/docker.sock
